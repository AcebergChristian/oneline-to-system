<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>project2</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #111827, #1f2937);
        color: #f9fafb;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      section {
        width: min(720px, 100%);
        background: rgba(17, 24, 39, 0.82);
        border: 1px solid rgba(156, 163, 175, 0.24);
        border-radius: 20px;
        padding: 32px;
      }
      pre {
        background: rgba(31, 41, 55, 0.92);
        padding: 16px;
        border-radius: 12px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>project2</h1>
        <p>前端端口 3002，后端端口 8002，已拆成独立服务。</p>
        <pre id="result">正在检查后端状态...</pre>
      </section>
    </main>
    <script>
      const apiBase = `${window.location.protocol}//${window.location.hostname}:8002`;
      fetch(`${apiBase}/api/health`)
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("result").textContent = JSON.stringify(data, null, 2);
        })
        .catch((error) => {
          document.getElementById("result").textContent = `后端不可达: ${error}`;
        });
    </script>
  </body>
</html>
