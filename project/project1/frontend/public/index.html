<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>project1</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      section {
        width: min(720px, 100%);
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.4);
      }
      pre {
        background: rgba(30, 41, 59, 0.85);
        padding: 16px;
        border-radius: 12px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>project1</h1>
        <p>前端已独立运行在 3001，后端健康检查地址为 <code>/api/health</code>。</p>
        <pre id="result">正在检查后端状态...</pre>
      </section>
    </main>
    <script>
      const apiBase = `${window.location.protocol}//${window.location.hostname}:8001`;
      fetch(`${apiBase}/api/health`)
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("result").textContent = JSON.stringify(data, null, 2);
        })
        .catch((error) => {
          document.getElementById("result").textContent = `后端不可达: ${error}`;
        });
    </script>
  </body>
</html>
