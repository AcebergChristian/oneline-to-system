services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 生成的子项目与会话数据必须持久化到宿主机:
      # 否则容器一重建,项目目录和会话记录全部丢失,
      # 项目编号会重置,新项目的端口就会和还在跑的旧容器冲突。
      - ./project:/app/project
      - ./backend/data:/app/backend/data
    env_file:
      - .env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DOCKER_HOST: unix:///var/run/docker.sock
    extra_hosts:
      # Linux 部署时 Docker 默认没有 host.docker.internal(Docker Desktop 才有),
      # 加上 host-gateway 映射,主控容器才能探到宿主机上子项目的端口。
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
